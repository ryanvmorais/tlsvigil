# CI pipeline (GitHub Actions). Five independent jobs, each mirroring a slice of the local
# quality gate (.githooks/pre-commit) so that a green check means the same as a clean checkout:
#   quality   ruff, black, mypy and pytest on every Python the classifiers claim, 3.12 (the floor)
#             to 3.15 (the newest stable), on Linux and on Windows
#   package   `uv build`: the metadata renders on PyPI, the wheel has no runtime dependency, and
#             it installs and runs in a clean environment (the release ships this exact build)
#   security  pip-audit over uv.lock (known CVEs in the locked graph)
#   shell     shellcheck over the versioned Git hook
#   action    the Action itself (`uses: ./`) on Linux, Windows and macOS, with the runner's own
#             Python: the exit code and the result of the step for five runs (spec 006, RF-12)
#
# The repository is public, so Actions minutes are free: it runs on pull requests, on every push
# to main (the merge commit is checked too) and by hand.
name: CI

on:
  # The merge commit is checked too, so main is never red by surprise.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; a job that needs more declares it itself (none does today).
permissions:
  contents: read

# A new push to the same pull request cancels the run that is now obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # The Linux names stay "Quality (Python X)": the ruleset requires 3.12 and 3.15 by that name.
    name: Quality (${{ matrix.label }}Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every Python in the classifiers runs on both systems, so "OS Independent" is tested, not
        # just declared; the floor is requires-python in pyproject.toml.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: [linux, windows]
        # Each include matches every combination of its `os` and only adds the runner and the label.
        include:
          - os: linux
            runner: ubuntu-26.04
            label: ""
          # The one exception to the ubuntu-26.04 rule: Windows is where the console encoding, the
          # file modes and the paths differ.
          - os: windows
            runner: windows-2025
            label: "Windows, "
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Show Python version
        run: uv run python -c "import sys; print(sys.version)"

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov

  package:
    name: Package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: uv build

      # Same 7-day cooldown as pip-audit: a release of the tool that was just published (and may be
      # compromised) does not run in CI until it has aged.
      - name: The metadata renders on PyPI
        run: uvx --exclude-newer "7 days" twine check --strict dist/*

      # Zero runtime dependencies is a design decision (ADR-1, standard library only): a
      # `Requires-Dist` line in the wheel means someone added a dependency by accident.
      - name: The wheel declares no runtime dependency
        run: |
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:'; then
            echo "::error::the wheel declares a runtime dependency; TLSVigil must stay dependency-free"
            exit 1
          fi

      - name: The wheel installs in a clean environment and runs
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean" dist/*.whl
          "$RUNNER_TEMP/clean/bin/tlsvigil" --version

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Export uv.lock to requirements
        run: uv export --frozen --no-emit-project --no-hashes --all-groups --all-extras -o requirements-audit.txt

      # --no-deps: the export already has the full, locked graph; without it pip-audit would
      # resolve again and audit a set that is not the lock's.
      - name: pip-audit (known CVEs)
        run: uvx --exclude-newer "7 days" pip-audit --requirement requirements-audit.txt --no-deps --disable-pip

  shell:
    name: Shell (shellcheck)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      # The runner image ships shellcheck; the install only runs if a future image drops it.
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -y -q shellcheck)

      - name: Shellcheck the Git hook
        run: shellcheck --version && shellcheck .githooks/pre-commit

  action:
    # The Action as a workflow uses it, from this checkout, with no uv and no Python set up: the
    # runner's own Python runs the source (spec 006, ADR-1). It reaches no channel, no real host
    # and no API: the host is a closed port of the runner's loopback, notify is off or stops at
    # the channel settings before any check, and only the cache restore talks to the runner's
    # storage. Not required by the ruleset, like CodeQL.
    name: Action (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The three systems of the hosted runners (RNF-05); ubuntu-26.04 as everywhere else.
        runner: [ubuntu-26.04, windows-2025, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step needs the GitHub token; it is not left on disk.
          persist-credentials: false

      # Each run may fail on purpose; the last step compares every outcome and exit code.
      - name: Needs attention, delivered (exit 1, the step succeeds)
        id: attention
        continue-on-error: true
        uses: ./
        with:
          config: tests/data/action/refused.toml
          notify: false

      - name: Needs attention with fail-on-attention (exit 1, the step fails)
        id: fail-on-attention
        continue-on-error: true
        uses: ./
        with:
          config: tests/data/action/refused.toml
          notify: false
          fail-on-attention: true

      - name: A missing configuration (exit 2)
        id: missing-config
        continue-on-error: true
        uses: ./
        with:
          config: tests/data/action/missing.toml
          notify: false

      - name: An invalid input (exit 2)
        id: invalid-input
        continue-on-error: true
        uses: ./
        with:
          config: tests/data/action/refused.toml
          notify: maybe

      # notify on: the restore runs and finds no state; Telegram has no token, so the command
      # stops before any check and the save is skipped.
      - name: A channel without its settings (exit 2)
        id: no-channel-settings
        continue-on-error: true
        uses: ./
        with:
          config: tests/data/action/telegram.toml
          notify: true

      # The values reach the script as variables, never as text of the script.
      - name: Compare the outcomes and the exit codes
        env:
          ATTENTION: ${{ steps.attention.outcome }} ${{ steps.attention.outputs.exit-code }}
          FAIL_ON_ATTENTION: ${{ steps.fail-on-attention.outcome }} ${{ steps.fail-on-attention.outputs.exit-code }}
          MISSING_CONFIG: ${{ steps.missing-config.outcome }} ${{ steps.missing-config.outputs.exit-code }}
          INVALID_INPUT: ${{ steps.invalid-input.outcome }} ${{ steps.invalid-input.outputs.exit-code }}
          NO_CHANNEL_SETTINGS: ${{ steps.no-channel-settings.outcome }} ${{ steps.no-channel-settings.outputs.exit-code }}
        shell: bash
        run: |
          status=0
          expect() {
            if [ "$2" = "$3" ]; then
              echo "ok        $1: $2"
            else
              echo "::error title=Action::$1: expected \"$3\", got \"$2\""
              status=1
            fi
          }
          expect "needs attention" "$ATTENTION" "success 1"
          expect "fail-on-attention" "$FAIL_ON_ATTENTION" "failure 1"
          expect "missing configuration" "$MISSING_CONFIG" "failure 2"
          expect "invalid input" "$INVALID_INPUT" "failure 2"
          expect "channel without settings" "$NO_CHANNEL_SETTINGS" "failure 2"
          exit "$status"
